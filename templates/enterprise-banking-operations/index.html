<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0B3D5C" />
    <meta
      name="description"
      content="Aurevia — payments, accounts, exceptions, AML screening, and clearing for Poluru National."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Aurevia · Poluru National</title>
    <style>
      .boot-msg,
      .boot-error {
        max-width: 40rem;
        margin: 3rem auto;
        padding: 1.25rem 1.4rem;
        border: 1px solid #c5d4de;
        border-radius: 10px;
        background: #fff;
        color: #102433;
        font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
      }
      .boot-error pre {
        overflow: auto;
        white-space: pre-wrap;
        color: #4d6574;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>
    <div id="app"><p class="boot-msg">Loading Aurevia…</p></div>
    <script type="module">
      import('/src/main.js').catch((error) => {
        const app = document.querySelector('#app');
        const message = error?.stack || error?.message || String(error);
        if (app) {
          app.innerHTML = `<div class="boot-error"><strong>Aurevia could not start</strong><pre>${message}</pre></div>`;
        }
        console.error(error);
      });
    </script>
  </body>
</html>
